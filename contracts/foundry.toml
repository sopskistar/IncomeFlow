[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib", "../node_modules"]
solc_version = "0.8.29"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["@reactive/=lib/reactive-lib-omni/", "@openzeppelin/=../node_modules/@openzeppelin/", "forge-std/=lib/forge-std/src/"]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 32
fail_on_revert = true
