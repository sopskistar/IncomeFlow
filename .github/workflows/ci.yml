name: IncomeFlow checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: income-flow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.10.0
      - run: npm ci
      - run: npm run contracts:bootstrap
      - run: forge fmt --root contracts --check
      - run: npm run contracts:build
      - run: npm run contracts:test
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          CI: true
      - name: Verify public testnet application
        run: npm run test:browser
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: https://incomeflow-gamma.vercel.app
# No signing keys or automatic contract deployments. The read-only browser
# integration tests use the public, genuinely deployed testnet contracts.
