name: Publish focused IncomeFlow demo

on:
  push:
    paths:
      - .github/workflows/publish-focused-passport-video.yml

permissions:
  contents: write

jobs:
  polish-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg when necessary
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Download unchanged original public release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/income-film
          gh release download incomeflow-payment-passport --repo "$GITHUB_REPOSITORY" --pattern incomeflow-passport-demo.mp4 --dir /tmp/income-film
          test -s /tmp/income-film/incomeflow-passport-demo.mp4
          sha256sum /tmp/income-film/incomeflow-passport-demo.mp4
      - name: Create focused cut without repetitive caption overlays
        shell: bash
        run: |
          bash scripts/polish-passport-demo.sh /tmp/income-film/incomeflow-passport-demo.mp4 /tmp/income-film/incomeflow-passport-demo-focused.mp4
          python3 - <<'PY'
          import json,subprocess
          p='/tmp/income-film/incomeflow-passport-demo-focused.mp4'
          d=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_format','-show_streams','-of','json',p]))
          t=float(d['format']['duration'])
          assert 130<t<150,t
          video=next(s for s in d['streams'] if s['codec_type']=='video')
          audio=next(s for s in d['streams'] if s['codec_type']=='audio')
          assert (video['width'],video['height'],video['codec_name'])==(1920,1080,'h264')
          assert audio['codec_name']=='aac'
          print(f'Validated focused film: {t:.2f}s, H.264/AAC 1920x1080')
          PY
      - name: Generate representative visual review frames
        shell: bash
        run: |
          mkdir -p /tmp/income-film/qa
          for t in 5 22 42 67 104 127; do
            ffmpeg -hide_banner -loglevel error -ss "$t" -i /tmp/income-film/incomeflow-passport-demo-focused.mp4 -frames:v 1 -y "/tmp/income-film/qa/frame-${t}.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: focused-income-demo-review
          path: /tmp/income-film/qa/
          retention-days: 7
      - name: Publish separate focused video without overwriting original
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload incomeflow-payment-passport /tmp/income-film/incomeflow-passport-demo-focused.mp4 --repo "$GITHUB_REPOSITORY" --clobber
          gh release view incomeflow-payment-passport --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name=="incomeflow-passport-demo-focused.mp4") | [.name,.size,.url] | @tsv'
