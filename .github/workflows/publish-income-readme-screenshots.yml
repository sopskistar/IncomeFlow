name: Publish verified IncomeFlow README screenshots

on:
  push:
    paths:
      - .github/workflows/publish-income-readme-screenshots.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Recover verified public screenshots from the successful production QA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 45948544775 --repo "${GITHUB_REPOSITORY}" --name public-visual-qa --dir "${RUNNER_TEMP}/verified"
          source_dir="${RUNNER_TEMP}/verified/artifacts/public-qa/passport"
          test -s "${source_dir}/landing-desktop.png"
          test -s "${source_dir}/desktop.png"
          test -s "${source_dir}/landing-mobile.png"
          mkdir -p docs/screenshots
          cp "${source_dir}/landing-desktop.png" docs/screenshots/incomeflow-homepage-desktop.png
          cp "${source_dir}/desktop.png" docs/screenshots/payment-passport-desktop.png
          cp "${source_dir}/landing-mobile.png" docs/screenshots/incomeflow-homepage-mobile.png
          python3 - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text()
          before = "![IncomeFlow original brand and application preview artwork](public/brand/repository-preview.png)"
          after = "![IncomeFlow homepage captured during verified production QA](docs/screenshots/incomeflow-homepage-desktop.png)"
          assert before in s, "README source for homepage image changed"
          s = s.replace(before, after, 1)
          before = "[![Watch IncomeFlow's narrated demo — original repository preview artwork](public/brand/repository-preview.png)]"
          after = "[![Watch the narrated IncomeFlow demo — actual production Payment Passport screenshot](docs/screenshots/payment-passport-desktop.png)]"
          assert before in s, "README source for video preview changed"
          s = s.replace(before, after, 1)
          before = "**Actual production screenshots:**"
          after = "**Actual production screenshots:** [Homepage desktop](docs/screenshots/incomeflow-homepage-desktop.png) · [Payment Passport desktop](docs/screenshots/payment-passport-desktop.png) · [Homepage mobile](docs/screenshots/incomeflow-homepage-mobile.png). "
          assert before in s, "Screenshot section changed"
          s = s.replace(before, after, 1)
          s = s.replace("The archive is a time-limited CI artifact; the image above is **original brand artwork, not a screenshot**. The production app is the current source for live UI inspection.", "The embedded images above are real production captures, not generated mockups. The archive is a time-limited CI artifact.", 1)
          p.write_text(s)
          PY
          git add README.md docs/screenshots/incomeflow-homepage-desktop.png docs/screenshots/payment-passport-desktop.png docs/screenshots/incomeflow-homepage-mobile.png
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "docs: embed verified production screenshots in README"
          git push origin HEAD:main
